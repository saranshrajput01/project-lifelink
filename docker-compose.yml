# ─── Project LIFELINK — Docker Compose ───
# Run everything: docker compose up -d
# Stop everything: docker compose down
# Reset database: docker compose down -v (deletes data!)

services:
  # ─── PostgreSQL + pgvector (Main Database) ─────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lifelink-postgres
    environment:
      POSTGRES_USER: lifelink
      POSTGRES_PASSWORD: lifelink
      POSTGRES_DB: lifelink_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifelink -d lifelink_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Redis (Cache + Task Queue) ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lifelink-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─── MinIO (Local S3 — Document Storage) ───────────────
  minio:
    image: minio/minio:latest
    container_name: lifelink-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Backend (FastAPI) ─────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifelink-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://lifelink:lifelink@postgres:5432/lifelink_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT_URL: http://minio:9000
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  # Hot reload in development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ─── Frontend (React — dev server) ─────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lifelink-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Don't overwrite node_modules
    depends_on:
      - backend
    restart: unless-stopped

  # ─── pgAdmin (Web GUI to view the PostgreSQL database) ───
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lifelink-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lifelink.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"   # open http://localhost:5050
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
