# ─── Project LIFELINK — Render.com Blueprint ───
# Deploys the FastAPI backend as a Docker web service on Render's free tier.
# Database + document storage live on Supabase (Postgres+pgvector + Storage).
#
# Setup:
#   1. Push this repo to GitHub.
#   2. On render.com → New → Blueprint → pick this repo. Render reads render.yaml.
#   3. Fill the env vars marked `sync: false` in the Render dashboard
#      (secrets — never commit them). See docs/DEPLOY_SUPABASE_RENDER.md.
#
# Note: Render's free tier spins the service down after inactivity (cold starts).
# That's fine for a demo. Redis is optional (Celery not required at runtime).

services:
  - type: web
    name: lifelink-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore          # closest to India on Render free tier
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # Free instance = 512MB RAM. torch/MiniLM + PaddleOCR OOM-kill the server
      # on upload, so keep them off here (chat falls back to summary context).
      - key: ENABLE_LOCAL_EMBEDDINGS
        value: "false"
      - key: ENABLE_LOCAL_OCR
        value: "false"
      # ─── Supabase Postgres (Session/Transaction pooler connection string) ───
      # Format: postgresql+asyncpg://postgres.<ref>:<pwd>@<host>:5432/postgres
      - key: DATABASE_URL
        sync: false
      # ─── JWT ───
      - key: SECRET_KEY
        generateValue: true     # Render auto-generates a strong secret
      # ─── Supabase Storage (S3-compatible) ───
      - key: S3_ENDPOINT_URL
        sync: false             # https://<ref>.supabase.co/storage/v1/s3
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET_NAME
        value: lifelink-documents
      - key: S3_REGION
        sync: false             # e.g. ap-south-1 (match your Supabase project)
      # ─── AI (Groq) ───
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_MODEL_STRONG
        value: qwen/qwen3.8-27b
      # ─── Email (optional) ───
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # ─── CORS (set to your deployed frontend URL) ───
      - key: CORS_ORIGINS
        sync: false             # e.g. ["https://lifelink.vercel.app"]
